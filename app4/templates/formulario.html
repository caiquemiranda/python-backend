<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if tarefa %}Editar Tarefa{% else %}Nova Tarefa{% endif %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .flash-messages {
            margin-bottom: 20px;
        }

        .flash-message {
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .flash-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .flash-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .btn {
            display: inline-block;
            padding: 8px 16px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary {
            background-color: #2ecc71;
        }

        .btn-back {
            background-color: #7f8c8d;
            margin-left: 10px;
        }

        .required {
            color: #e74c3c;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>{% if tarefa %}Editar Tarefa{% else %}Nova Tarefa{% endif %}</h1>

        <!-- Mensagens de feedback -->
        <div class="flash-messages">
            {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="flash-message flash-{{ category }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>

        <form method="POST">
            <div class="form-group">
                <label for="titulo">Título <span class="required">*</span></label>
                <input type="text" id="titulo" name="titulo" required value="{{ tarefa.titulo if tarefa else '' }}">
            </div>

            <div class="form-group">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" name="descricao">{{ tarefa.descricao if tarefa else '' }}</textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Salvar</button>
                <a href="{{ url_for('listar_tarefas') }}" class="btn btn-back">Cancelar</a>
            </div>
        </form>
    </div>
</body>

</html>
